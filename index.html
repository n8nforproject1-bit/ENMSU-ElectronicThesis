    <!-- JavaScript สลับหน้าต่างแบบแยกขาด -->
    <script>
        function switchTab(tabId) {
            // ซ่อนทุกหน้าต่างออกไปก่อน
            document.querySelectorAll('.tab-content').forEach(function(tab) {
                tab.style.display = 'none';
            });
            // เปิดแสดงเฉพาะหน้าต่างที่เลือก
            document.getElementById(tabId).style.display = 'block';
           
            // ถ้ากดเข้าแท็บแอดมิน และฟังก์ชันล็อกอินผ่านแล้ว ให้โหลดข้อมูลมารอตรวจ
            if(tabId === 'admin-view' && typeof loadPendingSubmissions === 'function') {
                const adminDashboard = document.getElementById('admin-dashboard-box');
                if(adminDashboard && adminDashboard.style.display === 'block') {
                     loadPendingSubmissions();
                }
            }
        }


        document.addEventListener('click', function(e) {
            const anchor = e.target.closest('a');
            if (anchor && anchor.href && anchor.href.includes('page=flipbook')) {
                e.preventDefault();
                window.top.location.href = anchor.href;
            }
        });
    </script>
